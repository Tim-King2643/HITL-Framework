<script>
// Four views (GR-059) in the sandbox. This page runs inside pcf7.html and reads the sandbox's own data from it:
// WR_DATA (Progression Ceilings, Consequence of Error, factors and notes), the PCF 7.0 process tree and its RACI,
// the role catalog, activity CRUD and the Work-Product Catalog, the change log, and the selected organization's
// assessments and overrides. Nothing here is a copy: change the data in pcf7.html and this page follows.
// The view code began as the approved four-view sketch (retired Oct 18, 2026; it stays in the git history).
const P=(window.parent&&window.parent!==window)?window.parent:null;
if(!P||!P.FV_SOURCE){document.write('<p style="font:14px sans-serif;padding:20px">This page runs inside the sandbox. <a href="pcf7.html">Open the sandbox</a>.</p>');throw new Error('four_views.html needs pcf7.html');}
const SRC=P.FV_SOURCE;
const DATA=(function(){
  const acts=[],groups=[];
  SRC.PCF7.groups.forEach(g=>{groups.push([g.code,g.name]);
    g.l3.forEach(l3=>{const proc=l3.code+' '+l3.name, raci=l3.raci||{}, A=P.parseRaciField(raci.A), R=P.parseRaciField(raci.R);
      (l3.l4&&l3.l4.length?l3.l4:[l3]).forEach(x=>{const w=SRC.WR_DATA[x.code];if(!w)return;
        acts.push({code:x.code,name:x.name,A:A[0]||'',Aroles:A,R:R.filter(r=>A.indexOf(r)<0).length?R:R,ceiling:w.ceiling,cons:w.cons,
          f:(w.ceilingFactors||[]).slice(),note:w.ceilingNote||'',cn:w.consNote||'',cf:(w.consFactors||[]).slice(),proc});});});});
  return {acts,groups,roles:SRC.ROLE_TAXONOMY.map(r=>({name:r.name,tier:r.tier,reportsTo:r.reportsTo}))};
})();
const CRUD={crud:Object.fromEntries(Object.entries(SRC.ACTIVITY_CRUD).map(([k,x])=>[k,{C:x.create||[],R:x.read||[],U:x.update||[],D:x.delete||[]}])),wps:SRC.WORK_PRODUCTS};
const RACI_CI=Object.fromEntries(SRC.PCF7.groups.flatMap(g=>g.l3.map(l3=>[l3.code,{C:P.parseRaciField((l3.raci||{}).C),I:P.parseRaciField((l3.raci||{}).I)}])));
// Activities with a logged ceiling change, for the Change history link.
const CHIST=[...new Set((SRC.CHANGE_LOG||[]).filter(e=>/^wr-/.test(e.kind||'')&&e.target&&e.target.activity).flatMap(e=>String(e.target.activity).split(/,\s*/)))];
// Activity-level RACI (GR-060, CL-018): each activity's own Accountable, Responsible, Consulted and Informed roles.
const RACI_ACT=SRC.ACTIVITY_RACI;
// The Work Element Reference Data (GR-058, CL-019): control element, what each element acts on, and the
// elements that do not apply, for all 118 activities. Master data lives in pcf7.html's WORK_ELEMENTS.
const WORKED=SRC.WORK_ELEMENTS;

const HPCT={"Human-only":95,"Judgment":82,"Augmentation":62,"Oversight":48,"Agent-delegation":28,"Automation":10};

const STEPDEF={
  "Human-only": "A person does all of the work; AI plays no part in it.",
  "Judgment": "A person forms the reasoning and makes the call. AI may supply raw inputs (data, a ranking, a benchmark) but does not produce the candidate decision.",
  "Augmentation": "The person remains the primary actor and does the work themselves; AI assists in real time but never acts unilaterally, and there is no separate approval gate.",
  "Oversight": "AI performs or proposes the complete work product; a person reviews and approves (or rejects) each instance before it takes effect.",
  "Agent-delegation": "An AI agent performs the work autonomously within policy bounds; a person handles only flagged exceptions, not every instance.",
  "Automation": "AI performs and completes the work with no person in the loop for that instance — exceptions included."
};
const GATE_EV=[
  ["AI-supplied input is relevant and useful to the person doing the work", "No autonomous action exists yet, so there's no error rate to measure"],
  ["AI's real-time assistance (drafts, suggestions, summaries) is used by the person most of the time", "Spot checks show the assistance doesn't introduce errors the person misses"],
  ["AI's complete proposed work agrees with what the person would have produced or decided, most of the time", "Enough real instances have run to trust that agreement rate"],
  ["A high share of full-review instances pass clean (audit-pass rate), sustained over real volume", "Accuracy is proven within defined policy bounds, and the system reliably flags when it's out of bounds (exception-detection recall)"],
  ["Sustained low exception rate over real volume", "An explicit governance sign-off gate layered on top (a policy choice, not just a technical threshold)"]
];
const ORGNAME=()=>isOrg()?P.ACTIVE_ORG.name:'Reference Model';
const ST=['Human-only','Judgment','Augmentation','Oversight','Agent-delegation','Automation'], rank=s=>ST.indexOf(s);
const HC={High:1,Critical:1};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const pct=(n,d)=>d?Math.round(100*n/d)+'%':'—';
// RACI is activity level (GR-060, Tim's decision Oct 10, 2026); S.raci stays 'act'. Process-level data is kept only to compare against.
let S={coe:true,raci:'act',fmode:'exec',dmode:'wp',view:'work',org:'ref',pmode:'load',stage:'Automation',appr:'R',esc:'A',wg:'7.2',ws:'all',wsel:{'7.2.1.4':{t:'gate',k:2}}}, opened={};
const VIEWS=[
 {id:'work',name:'Work',q:'Where does each activity sit, and what moves next?'},
 {id:'people',name:'People',q:'What does this mean for each role?'},
 {id:'data',name:'Data',q:'What moves between activities, and who has to check it?'},
 {id:'findings',name:'Findings',q:'What departs from the reference, and what needs a decision?'}];
function btns(list,key){return '<div class="stack">'+list.map(o=>'<button class="'+(S[key]===o[0]?'on':'')+'" onclick="S.'+key+'=\''+o[0]+'\';render()">'+o[1]+'</button>').join('')+'</div>'}
function tile(n,l,w){return '<div class="tile"><div class="n">'+n+'</div><div class="l">'+l+'</div>'+(w!=null?'<div class="was">'+w+'</div>':'')+'</div>'}
// Consequence of Error gates (proposed Oct 14, 2026): the rating matters only at the two steps where a person stops
// seeing every instance. Agent-delegation -> Automation is closed for High or Critical, or when a ceiling factor holds
// an element with a person; Oversight -> Agent-delegation is closed for Critical. Toggle in the left panel.
function coeCap(a,c){const held=a.f.some(f=>FMAP[f]);
  if(c==='Automation'&&(HC[a.cons]||held)) c='Agent-delegation';
  if(a.cons==='Critical'&&rank(c)>rank('Oversight')) c='Oversight';
  return c;}
const baseCeil=a=>S.coe?coeCap(a,a.ceiling):a.ceiling;
const derivedCeil=a=>{const c=baseCeil(a);return c==='Judgment'?'Augmentation':c};

/* ---------- People: load (from the GR-029/030 stress test) ---------- */
// GR-058 taken as approved (Tim, Oct 8): ceilings are always the derived ones.
const ceilOf=derivedCeil;
const workers=a=>a.R.length?a.R:a.Aroles;
const mgr=r=>{const x=DATA.roles.find(q=>q.name===r);return x&&x.reportsTo||r};
function duties(a,s){

  a.Aroles.forEach(r=>set(r,'answer'));

  const org={every:0,approve:0,exc:0,none:0,escHC:0,escMoved:0};
  DATA.acts.forEach(a=>{
    const c=ceilOf(a), s=target==='Today'?curOf(a):target==='Human-only'?'Human-only':(rank(target)<rank(c)?target:c);
    if(rank(s)<=2) org.every++; else if(s==='Oversight') org.approve++; else if(s==='Agent-delegation'){org.exc++; if(HC[a.cons]){org.escHC++; const tg=S.esc==='A'?a.Aroles:S.esc==='mgr'?workers(a).map(mgr):workers(a); if(tg.some(x=>!workers(a).includes(x))) org.escMoved++;}} else org.none++;
    a.Aroles.forEach(r=>{if(roles[r]){roles[r].acc++;roles[r].racts.push({a,k:'A'})}});
    a.R.forEach(r=>{if(roles[r]){roles[r].resp++;roles[r].racts.push({a,k:'R'})}});

/* ---------- Data ---------- */
// Same rule as the work-product analysis (GR-046): producers create or update a work product; an activity relies on it when
// it reads or updates it. It is AI-touched when its most automated other producer is at Augmentation or further. A relying
// activity at Judgment, Augmentation or Oversight is a verification point; at Agent-delegation or Automation with a High or
// Critical Consequence of Error it is an unchecked hand-off.
const ACT=Object.fromEntries(DATA.acts.map(a=>[a.code,a]));
const WPN=Object.fromEntries(CRUD.wps.map(w=>[w.id,w]));
function stageNow(a){const c=derivedCeil(a);return S.stage==='Today'?curOf(a):S.stage==='Human-only'?'Human-only':(rank(S.stage)<rank(c)?S.stage:c)}
function wpAnalysis(){
  return CRUD.wps.map(w=>{
    const prods=Object.keys(CRUD.crud).filter(c=>CRUD.crud[c].C.concat(CRUD.crud[c].U).includes(w.id));
    const pts=[],ho=[];let top=null;
    prods.forEach(p=>{if(!top||rank(stageNow(ACT[p]))>rank(stageNow(ACT[top])))top=p;});
    Object.keys(CRUD.crud).forEach(c=>{const x=CRUD.crud[c];if(!x.R.concat(x.U).includes(w.id))return;
      const others=prods.filter(p=>p!==c);if(!others.length)return;
      let t=others[0];others.forEach(p=>{if(rank(stageNow(ACT[p]))>rank(stageNow(ACT[t])))t=p;});
      if(rank(stageNow(ACT[t]))<2)return;
      const r=rank(stageNow(ACT[c]));
      if(r>=1&&r<=3) pts.push({c,p:t}); else if(r>=4&&HC[ACT[c].cons]) ho.push({c,p:t});
    });
    return {w,prods,top,pts,ho};
  });
}
/* ---------- Decision points (GR-021, GR-042) ---------- */
// The Human Accountability Anchor is each activity's Accountable role. An activity is a decision point when a person
// holds its Decide element, or its Verify element when it has no Decide, on every instance or on each flagged instance. Consequence of Error sets how much governance
// the decision point's record carries, not whether it is one. An activity that is neither maps to the downstream
// decision points its work product reaches; one that reaches none needs a named control (GR-054).
// Where the work is: the Reference Model at each activity's ceiling; an organization at its Current State.
const dpEl=a=>{const e=elsOf(a);return e.includes('Decide')?'Decide':e.includes('Verify')?'Verify':null};
const dpStage=a=>isOrg()?curOf(a):derivedCeil(a);
function dpLeads(a){if(isOrg()&&ABC_EL[a.code]){const g=ABC_EL[a.code];return Object.fromEntries(Object.keys(g).map(e=>[e,g[e][0]]));}return stageEls(a,dpStage(a));}
// A person holds it on every instance (Human, Human-led) or decides each flagged instance (AI-led, as at Agent-delegation).
const holds=v=>v==='Human'||v==='Human-led'||v==='AI-led';
const DPGOV={Low:'owner and override; reviewed when an exception comes up',Moderate:'owner, escalation path and override; reviewed periodically',
  High:'every field; each decision documented; reviewed on a set cadence',Critical:'every field; each decision documented with its evidence; reviewed on a set cadence and after every override'};
let DPC=null;
function dpAnalysis(){
  // recomputed on every render (render() clears it), so it follows the organization, its assessments and RACI
  if(DPC&&DPC.org===S.org) return DPC.m;
  const m={};
  DATA.acts.forEach(a=>{const e=dpEl(a),v=e&&dpLeads(a)[e];m[a.code]={el:e,lead:v,dp:!!(e&&holds(v)),ai:rank(dpStage(a))>=1,groups:[],feeds:[]};});
  // Read from each work product's CRUD (Tim, Oct 15): its decision points are the activities that create, update or delete
  // it where a person holds Decide or Verify. An activity's own work products are those it creates, updates or deletes;
  // an activity that only reads a work product decides something else. An activity that is not a decision point is decided
  // or verified at the decision points on its work products; none on any of them: it needs a named control.
  DATA.acts.forEach(a=>{const r=m[a.code],x=CRUD.crud[a.code];if(!x)return;
    const own=[...new Set(x.C.concat(x.U,x.D))].filter(w=>WPN[w]).sort(nat);
    r.groups=own.map(w=>({w,mine:x.C.includes(w)?'C':x.U.includes(w)?'U':'D',
      dps:Object.keys(CRUD.crud).filter(c=>m[c]&&m[c].dp&&wpOps(c,w)).sort(nat).map(c=>({c,op:wpOps(c,w)}))}));
    r.feeds=[...new Set(r.groups.flatMap(g=>g.dps.map(d=>d.c)))].filter(c=>c!==a.code).sort(nat);});
  DPC={org:S.org,m};return m;
}
// Which of create, update and delete an activity does to a work product ('C', 'U', 'D', joined), or '' if none.

  if(r.dp) h+=r.el+' is '+r.lead+' '+at+(r.lead==='AI-led'?': AI leads it, and a person decides each flagged instance, so the record also names the trigger condition':'')+(r.el==='Verify'?'; the activity has no Decide element, so the verification is the decision point':'')+'. Its Governed Decision Point record carries, for a '+a.cons+' Consequence of Error: '+DPGOV[a.cons]+'.';
  else if(r.feeds.length) h+='No person holds '+(r.el||'Decide or Verify')+' '+at+', so its work is decided or verified at the decision points on its work products, below. The anchor stays answerable for the activity itself.';
  else h+='<span class="red">No person holds '+(r.el||'Decide or Verify')+' '+at+', and '+(r.groups.length?'no activity that creates, updates or deletes its work products is a decision point':'it creates, updates or deletes no work product in the catalog yet')+'.</span> With no person in the instance, it needs a named control, such as sampled review or outcome monitoring (GR-054). The anchor stays answerable and owns the control.';

  if(r.groups.length){
    h+='<h5 style="margin:8px 0 4px">Decision points on its work products</h5><div class="isub" style="margin-bottom:4px">From each work product&rsquo;s CRUD: the activities that create, update or delete it where a person holds Decide or Verify.</div><table class="al">';
    // One line per work product says what this activity and the others do to it, e.g. "this activity (C)reates the work

function placeAssess(){
  document.querySelectorAll('tr.wr').forEach(tr=>{const a=tr.querySelector('.assess.abs');if(!a)return;
    const td=tr.firstElementChild,st=tr.querySelectorAll('.ramp .step')[2],code=tr.querySelector('.anm .code'),anm=tr.querySelector('.anm');
    if(!st||!code)return;const R=document.createRange();R.selectNodeContents(st);
    const tr0=td.getBoundingClientRect(),txt=R.getBoundingClientRect(),c=code.getBoundingClientRect();
    const left=txt.right-tr0.left-a.offsetWidth;
    a.style.left=left+'px';a.style.top=(c.bottom-tr0.top-a.offsetHeight+1)+'px';a.style.visibility='visible';
    anm.style.maxWidth=Math.max(160,(tr0.left+left)-anm.getBoundingClientRect().left-14)+'px';});
}
window.addEventListener('resize',()=>{if(S.view==='work')placeAssess();});
// The page sits inside pcf7.html; keep its frame as tall as its content.
function fit(){try{const f=window.frameElement;if(f)f.style.height=Math.max(600,document.documentElement.scrollHeight)+'px';}catch(e){}}
try{new ResizeObserver(fit).observe(document.body)}catch(e){}
