<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketch: Four-View Sandbox</title>
<style>
:root{--navy:#1B4F8A;--navy-d:#0D2D4F;--dark:#0D1B2A;--gray:#444;--lgray:#6B7A90;--bg:#F4F6FB;--border:#DDE3EE;--hl:#FFFBEB;--red:#991B1B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:60px}
.sk{background:#FEF3C7;border-bottom:2px solid #B8873F;color:#7A5A1E;font-size:12.5px;text-align:center;padding:9px 16px}
.top{background:var(--navy-d);color:#fff;padding:14px 16px 0}

.top h1{font-family:Georgia,serif;font-size:19px;font-weight:700}
.top .meta{font-size:12px;color:#9FC2EE;margin:3px 0 10px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.views{display:flex;gap:2px;flex-wrap:wrap}
.views button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 18px;border:none;border-radius:6px 6px 0 0;background:rgba(255,255,255,.08);color:#CFE0F5;cursor:pointer;text-align:left}

.org{display:flex;gap:6px;align-items:center;padding-bottom:9px;font-size:11px;color:#9FC2EE;text-transform:uppercase;letter-spacing:.05em}
.org select{font:inherit;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:600;padding:5px 8px;border-radius:6px;border:1px solid #fff;background:#fff;color:var(--navy-d);min-width:200px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.side{flex:0 1 320px;min-width:250px}
.side .q{font-family:Georgia,serif;font-size:16px;color:var(--navy-d);line-height:1.35;margin-bottom:8px}
.side p{font-size:12.5px;color:var(--gray);line-height:1.6;margin-bottom:10px}

.stack{display:flex;flex-direction:column;gap:5px}

.stack button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.replaces{font-size:11.5px;color:var(--lgray);border-top:1px solid var(--border);padding-top:10px;margin-top:16px;line-height:1.5}
.main{flex:1;min-width:300px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px}

.card .sub{font-size:12px;color:var(--lgray);margin-bottom:10px;line-height:1.5}

.tile .was{font-size:11px;color:var(--lgray)}
.prov{font-size:10.5px;color:var(--lgray);margin-top:8px}
.find{font-size:13px;line-height:1.6}

.t th:first-child{text-align:left}
.t td{padding:8px 8px;border-top:1px solid #EEF1F6;font-size:12.5px;text-align:right;vertical-align:top}
.t td:first-child{text-align:left}

.t tr.tier td{background:#EEF3FA;font-weight:600;color:var(--navy-d);font-size:11.5px;text-align:left}
.z{color:#B0B8C6}
.chg{background:var(--hl)}
.small{font-size:11px;color:var(--lgray)}
.tg{display:inline-block;width:12px;color:var(--navy);font-weight:700}
tr.det td{background:#FAFBFD;text-align:left;padding:6px 10px 12px 26px}
.al{border-collapse:collapse;width:100%}
.al td{font-size:12px;padding:3px 6px;border-top:1px solid #EEF1F6;text-align:left}
.al tr:first-child td{border-top:none}
.code{font-family:Consolas,monospace;color:var(--gray);white-space:nowrap}
.hc{color:var(--red)}

.outline a{color:var(--navy);font-weight:600}

.mramp{display:flex;align-items:center;gap:0}

.dot.sm{width:11px;height:11px}
.mgap{width:7px}.mlock{width:16px;text-align:center;line-height:0}.mlock svg{width:9px;height:10px}
.ramp{display:flex;align-items:flex-start;flex-wrap:nowrap}
.step{display:flex;flex-direction:column;align-items:center;min-width:92px;cursor:pointer}
.lbl{font-size:12.5px;margin-top:5px;white-space:nowrap}
.step.dim .lbl{color:#A9B2C2}
.step.sel .lbl{text-decoration:underline;text-underline-offset:4px}
.arr{width:34px;text-align:center;color:var(--navy);font-size:18px;cursor:pointer;line-height:18px}
.arr.dim{color:#C4CBD7}.arr.sel{font-weight:700}
.lock{width:34px;text-align:center;cursor:pointer;line-height:18px}
.ix{position:absolute;right:10px;top:6px;border:none;background:none;font-size:17px;color:var(--lgray);cursor:pointer}
.ibox{position:relative;margin:2px 0 4px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:12px 16px 14px;max-width:820px}
.ibox h4{font-size:14px;color:var(--navy-d);margin-bottom:2px}
.isub{font-size:11.5px;color:var(--lgray);margin-bottom:8px;line-height:1.5}
.isub a{color:var(--navy);font-weight:600}
.it{width:100%;border-collapse:collapse}
.it td{font-size:12.5px;padding:5px 8px;border-top:1px solid #EEF1F6;text-align:left;vertical-align:top}
.it tr:first-child td{border-top:none}
.it td.el{width:130px;white-space:nowrap}.it td.obj{color:var(--gray)}.it td.stt{width:240px}
.it tr.chgrow td{background:var(--hl)}
.ctl{color:var(--navy);font-size:11px;margin-left:3px}
.na{font-size:11.5px;color:var(--lgray);margin-top:8px}
.ev{margin-top:10px;font-size:12.5px;line-height:1.55}
.amber{color:#9A6A00}.red{color:var(--red)}
.wt td{vertical-align:middle}
.ahead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px;font-size:13px}
.acons{font-size:12px;white-space:nowrap;cursor:pointer;border-bottom:1px dotted currentColor}
.acons:hover,.acons.sel{border-bottom-style:solid}
.it td.ck{width:22px;color:var(--navy-d)}
.it tr.off td{color:#9AA3B2}
.wt .ramp{padding-left:4px}
.wt tr.det td{padding:0 12px 12px 12px;background:#fff}
@media(max-width:640px){.it td.obj{display:none}.it td.el,.it td.stt{width:auto;white-space:normal}.step{min-width:78px}.lbl{font-size:11px}}
@media(max-width:640px){.side,.main{flex:1 1 100%;min-width:0}.hide-s{display:none}.t th,.t td{padding:7px 4px}.views button{padding:8px 11px;font-size:12.5px}.views button small{display:none}}
</style></head><body>

ling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Chooses the operating model the rest of HR delivery runs inside — a structural design call, not a technical gap.", "cn": "Operational design choice (e.g., centralized vs. shared services); moderate ops/financial exposure if mis-sized, correctable at the next planning cycle.", "cf": ["ops", "reversibility"]}, {"code": "7.1.1.5", "name": "Determine HR costs", "A": "CHRO", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical", "governance"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Close call, flagged honestly: cost models are treated as a draft CHRO edits or a recommendation CHRO approves. No standing duty requires CHRO's personal review — ceiling moves one notch per the Progression Ceiling Rule.", "cn": "Cost modeling feeds budget planning — moderate operational/financial impact if wrong, but a draft CHRO reviews before it's acted on, which caps the exposure.", "cf": ["ops"]}, {"code": "7.1.1.6", "name": "Establish HR measures", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Defines what HR is measured against — the same 'sets what the system runs on' logic as 7.5.1.1/7.7.7.3.", "cn": "Defines what HR is measured against — moderate trust/reputation impact if metrics mislead leadership, but revisable each cycle.", "cf": ["trust"]}, {"code": "7.1.1.7", "name": "Communicate HR strategies", "A": "CHRO", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Message drafting and distribution can plausibly move to agent-delegation once accuracy on tone and compliance language is proven — a technical readiness question.", "cn": "Distribution of already-decided strategy; low legal exposure and high reversibility — a poorly worded message can be corrected.", "cf": ["legal", "reversibility"]}, {"code": "7.1.1.8", "name": "Develop strategy for HR systems/technologies/tools", "A": "CHRO", "ceiling": "Judgment", "cons": "High", "f": ["accountability", "floor"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "A wrong technology bet, including AI adoption itself, is costly and hard to unwind — the same standing strategic-judgment duty as the rest of 7.1.1, not a technical gap.", "cn": "A wrong systems-strategy call has real operational/financial impact (multi-year vendor and integration commitments) and broad reach across every downstream HR process — hard to unwind once contracted.", "cf": ["ops", "reach", "reversibility"]}, {"code": "7.1.1.9", "name": "Manage employer branding", "A": "CHRO", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Brand-voice consistency at agent-delegation scale is a capability still being proven, not a standing duty holding it back.", "cn": "Trust/reputation-facing (external candidate perception) but not legally exposed and easily adjusted.", "cf": ["legal", "trust"]}, {"code": "7.1.1.10", "name": "Design the employee experience", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Shapes policy and practice across the whole employee base — a standing design-judgment duty, the same 'sets what the system runs on' logic as 7.1.1.6.", "cn": "Broad reach (affects every employee's day-to-day) but a design choice, not a legal or individual-decision exposure — moderate human impact.", "cf": ["human", "legal", "reach"]}, {"code": "7.1.2.1", "name": "Perform strategic workforce planning", "A": "Director of HR Ops", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Headcount/skills forecasting sets the budget assumptions HR plans against — a standing planning-authority duty, not a temporary gap.", "cn": "Broad reach (headcount/skills planning) but a forecasting exercise revised each cycle — no legal exposure, moderate ops impact if under- or over-resourced.", "cf": ["ops", "reach"]}, {"code": "7.1.2.2", "name": "Develop total compensation and rewards strategy", "A": "Director of HR Ops", "ceiling": "Judgment", "cons": "High", "f": ["legal"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Pay-equity/compensation-discrimination exposure.", "cn": "Sets the pay structure the whole organization runs on — pay-equity/compensation-discrimination legal exposure plus wide reach keep this High.", "cf": ["legal", "reach"]}, {"code": "7.1.2.3", "name": "Develop succession plan", "A": "Director of HR Ops", "ceiling": "Judgment", "cons": "High", "f": ["floor"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Same continuity/favoritism-exposure logic as 7.3.3.4's succession-plan tag.", "cn": "Getting a critical-role succession call wrong is a real continuity risk, and perceived favoritism in who's chosen carries trust exposure — same logic as 7.3.3.4.", "cf": ["ops", "trust"]}, {"code": "7.1.2.4", "name": "Develop high performers/leadership programs", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Program design for high-potential and leadership tracks can move to agent-delegation once pattern-matching on what actually works is proven.", "cn": "Program design affecting a subset of employees; moderate human/trust impact, no legal exposure, revisable.", "cf": ["human", "trust"]}, {"code": "7.1.2.5", "name": "Develop diversity, equity, and inclusion plan", "A": "Director of HR Ops", "ceiling": "Oversight", "cons": "High", "f": ["legal"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "DEI plan design carries real legal exposure in either direction under the current landscape — the exposure attaches at this tier, so it's the ceiling, not a temporary gap.", "cn": "DEI plan design carries real legal exposure in either direction under the current landscape — legal exposure is the driving factor, and it attaches at design, not just execution.", "cf": ["legal"]}, {"code": "7.1.2.6", "name": "Implement diversity, equity, and inclusion plan", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "High", "f": ["legal", "governance"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Same DEI exposure as 7.1.2.5, at execution — the review checkpoint is the safeguard, not a temporary trust gap.", "cn": "Same legal exposure as 7.1.2.5, now at execution — a review checkpoint is the safeguard against a mishandled rollout.", "cf": ["legal", "reversibility"]}, {"code": "7.1.2.7", "name": "Design talent acquisition program", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Program design here is still building the evidence base for agent-delegation, not held back by a standing duty.", "cn": "Program-design work; low direct legal exposure, broad reach but easily revised before it touches an individual candidate.", "cf": ["human", "legal", "reach"]}, {"code": "7.1.2.8", "name": "Design talent development program", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Same technical-readiness question as 7.1.2.7 — program design for talent development, not yet proven for delegation.", "cn": "Same shape as 7.1.2.7 — design-stage work, no individual decision yet, easily revised.", "cf": ["human", "reversibility"]}, {"code": "7.1.2.9", "name": "Develop other HR programs", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Catch-all program design; low stakes until a specific program is built out and its own evidence base accumulates.", "cn": "Catch-all program design; low stakes until a specific program with its own exposure is built out.", "cf": ["reach", "reversibility"]}, {"code": "7.1.2.10", "name": "Develop HR policies", "A": "Director of HR Ops", "ceiling": "Oversight", "cons": "High", "f": ["legal"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Policy language is the direct compliance surface — same regulatory-teeth logic as 7.2.5.1/7.3.4.6. The compliance-surface duty attaches here, so it's the ceiling.", "cn": "Policy language is the direct compliance surface employees and courts will read — same regulatory-teeth logic as 7.2.5.1/7.3.4.6.", "cf": ["human", "legal"]}, {"code": "7.1.2.11", "name": "Administer HR policies", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["legal", "governance"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Inconsistent application risks disparate-treatment claims — the review checkpoint is the safeguard, so it's the ceiling, not a temporary gap.", "cn": "Inconsistent application across employees risks disparate-treatment claims — the review checkpoint at execution caps this below the policy-drafting tier itself.", "cf": ["human"]}, {"code": "7.1.2.12", "name": "Plan employee benefits", "A": "Director of HR Ops", "ceiling": "Oversight", "cons": "High", "f": ["legal", "governance"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "ERISA fiduciary/compliance exposure — the fiduciary sign-off is the ceiling.", "cn": "ERISA fiduciary and compliance exposure attaches to benefits plan design, same as 7.5.1.2 — the fiduciary sign-off is the safeguard.", "cf": ["legal", "reversibility"]}, {"code": "7.1.2.13", "name": "Develop workforce strategy models", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Workforce-strategy model design is still accumulating the evidence needed to trust agent-delegation, not blocked by a standing duty.", "cn": "Modeling/tooling work one step removed from any real decision; low legal or human impact on its own.", "cf": ["human", "legal"]}, {"code": "7.1.2.14", "name": "Implement workforce strategy models", "A": "Director of HR Ops", "ceiling": "Automation", "cons": "Low", "f": ["top"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Deploying an already-approved model is mechanical execution with no new exposure — full automation is the natural top of the ramp here.", "cn": "Deploying an already-approved model; mechanical, reversible, no new exposure introduced.", "cf": ["reversibility"]}, {"code": "7.1.2.15", "name": "Manage job families", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["legal", "governance"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "FLSA exemption-classification risk sits behind job-family structure — the review checkpoint is the ceiling.", "cn": "FLSA exemption-classification risk sits behind job-family structure — misclassifying exempt/non-exempt status is a real wage-and-hour exposure, capped by review.", "cf": ["legal"]}, {"code": "7.1.2.16", "name": "Develop and maintain job descriptions", "A": "Director of HR Ops", "ceiling": "Oversight", "cons": "Moderate", "f": ["legal"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "ADA essential-functions / FLSA-exemption language risk — the compliance-surface duty is the ceiling.", "cn": "ADA essential-functions and FLSA-exemption language live in the job description text — a compliance surface, but one corrected on the next revision rather than acted on irreversibly.", "cf": ["legal", "reversibility"]}, {"code": "7.1.3.1", "name": "Measure realization of HR objectives", "A": "Director of HR Ops", "ceiling": "Automation", "cons": "Low", "f": ["top"], "R": ["HRBP Manager"], "Aroles": ["Director of HR Ops"], "proc": "7.1.3 Monitor and update HR strategies, plans, and policies", "note": "Routine measurement of already-set objectives against real results — mechanical enough that full automation is the ceiling.", "cn": "Retrospective measurement; an error is caught and corrected at the next reporting cycle, no individual or legal exposure.", "cf": ["human", "legal", "reversibility"]}, {"code": "7.1.3.2", "name": "Measure contribution of HR to business strategy", "A": "Director of HR Ops", "ceiling": "Automation", "cons": "Low", "f": ["top"], "R": ["HRBP Manager"], "Aroles": ["Director of HR Ops"], "proc": "7.1.3 Monitor and update HR strategies, plans, and policies", "note": "Same mechanical-measurement logic as 7.1.3.1, applied to HR's contribution to business strategy.", "cn": "Same retrospective-measurement shape as 7.1.3.1 — low stakes, high reversibility.", "cf": ["reversibility"]}, {"code": "7.1.3.3", "name": "Communicate HR plans and provide upda nage employee requisitions", "note": "A standing strategic/budget-authority duty — the same logic as the rest of 7.1.1's strategy-formation work — holds this ceiling at Judgment regardless of technical capability.", "cn": "Budget-authority and strategic-fit judgment; moderate operational/financial impact if misaligned, corrected at the next planning pass.", "cf": ["ops", "reversibility"]}, {"code": "7.2.1.2", "name": "Open job requisitions", "A": "HRBP Manager", "ceiling": "Automation", "cons": "Low", "f": ["top"], "R": ["HR Generalist", "Recruiter"], "Aroles": ["HRBP Manager"], "proc": "7.2.1 Manage employee requisitions", "note": "Opening a requisition from an already-approved template is fully mechanical — automation is the natural ceiling.", "cn": "Mechanical record-creation step; fully reversible, no legal exposure.", "cf": ["reversibility"]}, {"code": "7.2.1.3", "name": "Approve job requisition", "A": "HRBP Manager", "ceiling": "Oversight", "cons": "High", "f": ["governance"], "R": ["HR Generalist", "Recruiter"], "Aroles": ["HRBP Manager"], "proc": "7.2.1 Manage employee requisitions", "note": "This is the budget-commitment gate, and its High Consequence of Error means a person signs off on every requisition, whatever the technology can do.", "cn": "This is the budget-commitment gate — reversing an approved-then-wrong hire is a real financial and organizational cost, and removing the sign-off here is a governance choice, not just a technical one.", "cf": ["ops", "reversibility"]}, {"code": "7.2.1.4", "name": "Post job requisitions", "A": "HRBP Manager", "ceiling": "Automation", "cons": "Moderate", "f": ["top"], "R": ["HR Generalist", "Recruiter"], "Aroles": ["HRBP Manager"], "proc": "7.2.1 Manage employee requisitions", "note": "Posting an already-approved requisition to job boards is fully mechanical — automation is the ceiling.", "cn": "A publication step and reversible, but the posting carries required notices (EEO, pay range), so an error has legal exposur oles": ["Recruiter"], "proc": "7.2.3 Screen and select candidates", "note": "Already at ceiling, a different reason than 7.4.4's — EEOC/adverse-impact liability on the hiring decision itself.", "cn": "The hire/reject decision itself — EEOC/adverse-impact liability, irreversible impact on the candidate's life and the employer's legal exposure, and no correction once the decision is communicated. Human impact, legal exposure, and reversibility all point the same direction.", "cf": ["human", "legal", "reversibility"]}, {"code": "7.2.4.1", "name": "Draw up and make offer", "A": "Recruiter", "ceiling": "Automation", "cons": "Moderate", "f": ["top"], "R": ["Compensation & Benefits Manager"], "Aroles": ["Recruiter"], "proc": "7.2.4 Manage new hire/re-hire", "note": "Mechanical drafting of an already-decided offer — full automation is the natural ceiling once the decision itself (7.2.4.2) is made.", "cn": "Mechanical drafting of an already-decided offer; moderate financial exposure if terms are wrong, correctable before signature.", "cf": ["ops", "reversibility"]}, {"code": "7.2.4.2", "name": "Negotiate offer", "A": "Recruiter", "ceiling": "Judgment", "cons": "High", "f": ["floor"], "R": ["Compensation & Benefits Manager"], "Aroles": ["Recruiter"], "proc": "7.2.4 Manage new hire/re-hire", "note": "The actual compensation trade-off decision — a standing judgment duty over a real financial commitment, not a runway gap.", "cn": "A live negotiation with a real candidate — a misstep has direct financial exposure (over- or under-offering) and can create pay-equity precedent for future hires.", "cf": ["ops"]}, {"code": "7.2.4.3", "name": "Hire candidate", "A": "Recruiter", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["governance"], "R": ["Compensation & Benefits Manager"], "Aroles": ["Recruiter"], "proc": "7.2.4 Manage new hire/re-hire", "note": "Administrative execution of an already-approved offer — moving past the current sign-off is a policy choice about how much r stem is configured, not in each instance.", "cn": "Retention-period compliance (EEOC recordkeeping requirements) sits behind this step, though it's a mechanical archiving task.", "cf": ["legal"]}, {"code": "7.3.1.1", "name": "Develop employee onboarding program", "A": "Onboarding Coordinator", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical"], "R": [], "Aroles": ["Onboarding Coordinator"], "proc": "7.3.1 Manage employee onboarding", "note": "Onboarding-program design can move toward agent-delegation once what works across cohorts is proven.", "cn": "Broad reach (every new hire) but program design, not an individual decision — revisable.", "cf": ["human", "reach"]}, {"code": "7.3.1.2", "name": "Implement employee onboarding program", "A": "Onboarding Coordinator", "ceiling": "Automation", "cons": "Low", "f": ["top"], "R": [], "Aroles": ["Onboarding Coordinator"], "proc": "7.3.1 Manage employee onboarding", "note": "Execution of an already-designed program — mechanical enough for full automation.", "cn": "Execution of an already-designed program; low stakes.", "cf": ["ops"]}, {"code": "7.3.1.3", "name": "Monitor and update employee onboarding program", "A": "Onboarding Coordinator", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": [], "Aroles": ["Onboarding Coordinator"], "proc": "7.3.1 Manage employee onboarding", "note": "Program monitoring can move toward agent-delegation once pattern detection across cohorts is proven.", "cn": "Monitoring/update work; corrected at the next review.", "cf": ["reversibility"]}, {"code": "7.3.2.1", "name": "Define employee performance objectives", "A": "HRBP Manager", "ceiling": "Judgment", "cons": "Moderate", "f": ["floor"], "R": ["HR Generalist"], "Aroles": ["HRBP Manager"], "proc": "7.3.2 Manage employee performance", "note": "Sets the criteria an individual employee will be judged against — a standing human-judgment duty over that person's own evaluation, not a runway gap.", "cn": "Sets th     ST.slice(2).map((s,i)=>tile(cnt[i+2],'ceiling at '+s)).join('')+'</div><div class="prov">Ceilings derived from the element ceilings (GR-058). '+(org?'Current State is Assessed; ceilings are Modeled. In this sketch, ABC Test Org shows the three illustrative element assessments (7.2.1.1, 7.2.1.4, 7.4.4); the real build reads its saved assessments.':'Modeled.')+'</div></div>';
  const f=[];
  if(!L.length) f.push('No activities match this filter.');
  if(L.length){
    const person=L.filter(a=>rank(derivedCeil(a))<=2), hcHigh=L.filter(a=>HC[a.cons]&&rank(derivedCeil(a))>=4);
    f.push(person.length+' of '+L.length+' must keep a person doing the work at every instance; '+cnt[5]+' may go all the way to Automation.');
    const fc={};person.forEach(a=>a.f.forEach(x=>fc[x]=(fc[x]||0)+1));const top=Object.entries(fc).sort((x,y)=>y[1]-x[1]);
    if(top.length) f.push('What keeps a person in the work: '+top.map(([k,n])=>FL[k].toLowerCase()+' ('+n+')').join(', ')+'.');
    if(hcHigh.length) f.push(hcHigh.length+' High or Critical activit'+(hcHigh.length>1?'ies have':'y has')+' a ceiling at Agent-delegation or Automation, where no person sees every instance: '+hcHigh.slice(0,5).map(a=>a.code).join(', ')+(hcHigh.length>5?' and '+(hcHigh.length-5)+' more':'')+'.');
    if(org){const as=L.filter(a=>ABCSTAGE[a.code]), past=as.filter(a=>rank(curOf(a))>rank(derivedCeil(a))), pe=as.filter(a=>pastEls(a).length);
      f.push(as.length+' of '+L.length+' assessed. '+(past.length?past.length+' past the ceiling. ':'None past its ceiling. ')+(pe.length?pe.map(a=>a.code+' '+pastEls(a).join(', ')).join('; ')+' past '+(pe.length>1?'their':'its')+' element ceiling, even though the activit'+(pe.length>1?'ies are':'y is')+' within its ceiling.':''));}
  }
  h+='<div class="card"><h3>What this shows</h3><ul class="find">'+f.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  h+='<div class="card" style="padding:0;overflow-x:auto"><table class="t wt"><thead><tr><th>Activity &middot; Accountable role &middot; Consequence of Error <span style="font-weight:400;text-transform:none;letter-spacing:0">&mdash; click a step, an arrow, the lock or the Consequence of Error</span></th></tr></thead><tbody>';
  let proc='';
  L.forEach(a=>{
    if(a.proc!==proc&&!a.proc.startsWith(a.code+' ')){proc=a.proc;h+=procRow(proc);}
    const pe=pastEls(a), box=infoBox(a);
    h+='<tr class="wr"><td><div class="ahead"><span><span class="code">'+a.code+'</span> '+esc(a.name)+(pe.length?' <span class="red" title="An element is past its own ceiling">\u25CF</span>':'')+' &middot; '+esc(a.Aroles.join(', '))+'</span><span class="acons'+((S.wsel[a.code]||{}).t==='coe'?' sel':'')+'" style="color:'+CONSC[a.cons]+'" onclick="wpick(\''+a.code+'\',\'coe\',0)" title="Consequence of Error">'+a.cons+'</span></div>'+ramp(a,true)+'</td></tr>';
    if(box) h+='<tr class="det"><td colspan="1">'+box+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------- Data ---------- */
// Same rule as the work-product analysis (GR-046): producers create or update a work product; an activity relies on it when
// it reads or updates it. It is AI-touched when its most automated other producer is at Augmentation or further. A relying
// activity at Judgment, Augmentation or Oversight is a verification point; at Agent-delegation or Automation with a High or
// Critical Consequence of Error it is an unchecked hand-off.
const ACT=Object.fromEntries(DATA.acts.map(a=>[a.code,a]));
const WPN=Object.fromEntries(CRUD.wps.map(w=>[w.id,w]));
function stageNow(a){const c=derivedCeil(a);return S.stage==='Human-only'?'Human-only':(rank(S.stage)<rank(c)?S.stage:c)}
function wpAnalysis(){
  return CRUD.wps.map(w=>{
    const prods=Object.keys(CRUD.crud).filter(c=>CRUD.crud[c].C.concat(CRUD.crud[c].U).includes(w.id));
    const pts=[],ho=[];let top=null;
    prods.forEach(p=>{if(!top||rank(stageNow(ACT[p]))>rank(stageNow(ACT[top])))top=p;});
    Object.keys(CRUD.crud).forEach(c=>{const x=CRUD.crud[c];if(!x.R.concat(x.U).includes(w.id))return;
      const others=prods.filter(p=>p!==c);if(!others.length)return;
      let t=others[0];others.forEach(p=>{if(rank(stageNow(ACT[p]))>rank(stageNow(ACT[t])))t=p;});
      if(rank(stageNow(ACT[t]))<2)return;
      const r=rank(stageNow(ACT[c]));
      if(r>=1&&r<=3) pts.push({c,p:t}); else if(r>=4&&HC[ACT[c].cons]) ho.push({c,p:t});
    });
    return {w,prods,top,pts,ho};
  });
}
function dataSide(){
  return '<div class="q">'+VIEWS[2].q+'</div><p>Each work product, the activities that produce it and every activity that relies on it. Once AI touches a work product, the person who relies on it next has to check it.</p>'+
   '<h5>Show</h5>'+btns([['wp','By work product: who has to check it'],['act','By activity: what it creates, reads, updates and deletes']],'dmode')+
   '<h5>Where the work is</h5>'+btns([['Human-only','Today: every activity at the Human-only baseline']].concat(ST.slice(1,5).map(s=>[s,'Up to '+s+', or each activity’s ceiling if lower'])).concat([['Automation','Every activity at its Progression Ceiling']]),'stage')+
   '<h5>Terms</h5><p><b>AI-touched:</b> the most automated activity that produces it is at Augmentation or further.<br><b>Verification point:</b> an activity at Judgment, Augmentation or Oversight relies on an AI-touched work product, so a person checks it before acting.<br><b>Unchecked hand-off:</b> the activity relying on it is at Agent-delegation or Automation with a High or Critical Consequence of Error, so no person is in between.</p>'+
   '<div class="replaces">Replaces <b>Data View (CRUD)</b> and brings in the work-product verification analysis (GR-046).</div>';
}
const nat=(a,b)=>a.localeCompare(b,undefined,{numeric:true});
function dataMain(){
  const A=wpAnalysis(), touched=A.filter(x=>x.pts.length||x.ho.length), nvp=A.reduce((s,x)=>s+x.pts.length,0), nho=A.reduce((s,x)=>s+x.ho.length,0);
  const roleCnt={};A.forEach(x=>x.pts.forEach(p=>ACT[p.c].Aroles.forEach(r=>roleCnt[r]=(roleCnt[r]||0)+1)));
  const hoActs=[...new Set(A.flatMap(x=>x.ho.map(h=>h.c)))].sort(nat);
  const where=S.stage==='Human-only'?'Today’s baseline':S.stage==='Automation'?'Every activity at its Progression Ceiling':'Every activity up to '+S.stage+', or its ceiling if lower';
  let h='<div class="card"><h3>Work products</h3><div class="sub">'+where+'.</div><div class="tiles">'+
    tile(CRUD.wps.length,'work products in the catalog')+tile(touched.length,'AI-touched where someone relies on them')+tile(nvp,'verification points, across '+Object.keys(roleCnt).length+' roles')+tile(nho,'unchecked hand-offs into High or Critical steps')+'</div><div class="prov">Modeled from the reference and the activity CRUD (all 118 activities confirmed).</div></div>';
  const f=[];
  if(!touched.length) f.push(S.stage==='Human-only'?'Today no work product is AI-touched, so nothing needs checking. Choose a stage to move the work up the ramp.':'Up to '+S.stage+', AI only supplies inputs, so no work product reaches the next activity AI-touched. Checking starts once a producer reaches Augmentation.');
  else{
    const top=A.slice().sort((x,y)=>y.pts.length-x.pts.length)[0], rr=Object.entries(roleCnt).sort((x,y)=>y[1]-x[1]);
    f.push(touched.length+' of '+CRUD.wps.length+' work products are AI-touched where someone relies on them. '+esc(top.w.name)+' carries the most checking: '+top.pts.length+' verification points.');
    f.push('The checking falls mostly on '+rr.slice(0,3).map(([r,n])=>r+' ('+n+')').join(', ')+'.');
    if(nho) f.push(nho+' unchecked hand-off'+(nho>1?'s':'')+' fall on '+hoActs.length+' activit'+(hoActs.length>1?'ies':'y')+': '+hoActs.map(c=>c+' '+esc(ACT[c].name)).slice(0,4).join('; ')+(hoActs.length>4?' and '+(hoActs.length-4)+' more':'')+'. Each needs a named control (GR-054).');
  }
  h+='<div class="card"><h3>What this shows</h3><ul class="find">'+f.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  if(S.dmode==='wp'){
    h+='<div class="card" style="padding:0;overflow-x:auto"><div style="padding:14px 18px 6px"><h3>By work product</h3><div class="sub">AI-touched first. Click a work product for each verification point and hand-off.</div></div><table class="t"><thead><tr><th>Work product</th><th style="text-align:left">Most automated producer</th><th class="hide-s" style="text-align:left">Verifications Required</th><th>Verification points</th></tr></thead><tbody>';
    A.slice().sort((x,y)=>(y.pts.length+y.ho.length?1:0)-(x.pts.length+x.ho.length?1:0)||y.pts.length-x.pts.length||x.w.name.localeCompare(y.w.name)).forEach(x=>{
      const o=opened['w'+x.w.id], rc={};x.pts.forEach(p=>ACT[p.c].Aroles.forEach(r=>rc[r]=(rc[r]||0)+1));
      const quiet=!(x.pts.length||x.ho.length);
      h+='<tr class="r" onclick="opened[\'w'+x.w.id+'\']=!opened[\'w'+x.w.id+'\'];render()"'+(quiet?' style="color:#8A94A6"':'')+'><td><span class="tg">'+(o?'−':'+')+'</span>'+esc(x.w.name)+'<div class="small" style="margin-left:12px">'+esc(x.w.system)+'</div></td><td style="text-align:left">'+(x.top?stageNow(ACT[x.top])+' <span class="small">'+x.top+'</span>':'—')+'</td><td class="hide-s" style="text-align:left">'+(Object.keys(rc).length?Object.entries(rc).sort((p,q)=>q[1]-p[1]).map(([r,n])=>esc(r)+(n>1?' ×'+n:'')).join(' · '):'<span class="z">—</span>')+'</td><td>'+(x.pts.length||'<span class="z">0</span>')+(x.ho.length?'<div class="small" style="color:#9A6A00">+'+x.ho.length+' unchecked hand-off'+(x.ho.length>1?'s':'')+'</div>':'')+'</td></tr>';
      if(o){const li=(p)=>'<tr><td class="code">'+p.c+'</td><td>'+esc(ACT[p.c].name)+'</td><td>'+esc(ACT[p.c].Aroles.join(', '))+'</td><td>'+stageNow(ACT[p.c])+'</td><td class="'+(HC[ACT[p.c].cons]?'hc':'')+'">'+ACT[p.c].cons+'</td><td class="small">relies on '+p.p+' at '+stageNow(ACT[p.p])+'</td></tr>';
        h+='<tr class="det"><td colspan="4">'+(x.pts.length?'<div class="small" style="margin:4px 0">Verification points</div><table class="al">'+x.pts.sort((p,q)=>nat(p.c,q.c)).map(li).join('')+'</table>':'')+(x.ho.length?'<div class="small" style="margin:8px 0 4px;color:#9A6A00">Unchecked hand-offs</div><table class="al">'+x.ho.sort((p,q)=>nat(p.c,q.c)).map(li).join('')+'</table>':'')+(quiet?'<div class="small">Produced in '+(x.prods.join(', ')||'no activity')+'. Nothing AI-touched reaches an activity that relies on it.</div>':'')+'</td></tr>';}
    });
    return h+'</tbody></table></div>';
  }
  h+='<div class="card" style="padding:0;overflow-x:auto"><div style="padding:14px 18px 6px"><h3>By activity</h3><div class="sub">What each activity creates, reads, updates and deletes. Confirmed for all 118 activities.</div></div><table class="t"><thead><tr><th>Activity</th><th style="text-align:left">Creates</th><th style="text-align:left">Reads</th><th class="hide-s" style="text-align:left">Updates</th><th class="hide-s" style="text-align:left">Deletes</th></tr></thead><tbody>';
  let proc='';
  DATA.acts.forEach(a=>{const x=CRUD.crud[a.code]||{C:[],R:[],U:[],D:[]};
    if(a.proc!==proc&&!a.proc.startsWith(a.code+' ')){proc=a.proc;h+='<tr class="tier"><td colspan="5">'+esc(proc)+'</td></tr>';}
    const cell=(ids,cls)=>'<td class="'+(cls||'')+'" style="text-align:left;font-size:12px">'+(ids.length?ids.map(i=>esc(WPN[i]?WPN[i].name:i)+(WPN[i]&&WPN[i].system?'<div class="small">'+esc(WPN[i].system)+'</div>':'')).join(''):'<span class="z">—</span>')+'</td>';
    h+='<tr><td><span class="code">'+a.code+'</span> '+esc(a.name)+'</td>'+cell(x.C)+cell(x.R)+cell(x.U,'hide-s')+cell(x.D,'hide-s')+'</tr>';});
  return h+'</tbody></table></div>';
}

/* ---------- Findings ---------- */
const PILOT=['7.2.1','7.3.2','7.6.2']; // processes ABC Test Org assessed in its pressure test
function findSide(){
  const org=isOrg();
  return '<div class="q">'+VIEWS[3].q+'</div><p>'+(org?'Where '+esc(ORGNAME())+' departs from the reference, and the few items that need a decision. Every number is read from its assessment and override records.':'The reference at a glance, drawn from the other three views, and the latest change made to it. Select an organization for its executive summary and exceptions.')+'</p>'+
   (org?'<h5>Show</h5>'+btns([['exec','Executive summary'],['exc','Exceptions report']],'fmode'):'')+
   '<div class="replaces">Replaces <b>Exceptions Report</b>, and is where the executive summary (GR-056) and the reference stress tests live.</div>';
}
function refFindings(){
  // everything at its ceiling, GR-058 ceilings
  const saved=S.stage; S.stage='Automation';
  const t=tally('Automation'), A=wpAnalysis(); S.stage=saved;
  const cnt=ST.map(s=>DATA.acts.filter(a=>derivedCeil(a)===s).length);
  const nvp=A.reduce((s,x)=>s+x.pts.length,0), hoActs=[...new Set(A.flatMap(x=>x.ho.map(h=>h.c)))];
  const accTop=Object.entries(t.roles).filter(([n,r])=>r.acc).sort((x,y)=>y[1].acc-x[1].acc).slice(0,3);
  const changed=DATA.acts.filter(a=>a.ceiling!==derivedCeil(a));
  let h='<div class="card"><h3>The reference at full progression</h3><div class="sub">Every activity at its Progression Ceiling. Modeled.</div><div class="tiles">'+
    tile(t.org.every+t.org.approve,'activities keep a person in every instance')+tile(t.org.exc,'run on flagged exceptions only')+tile(t.org.none,'have no person in the instance')+tile(hoActs.length,'need a named control for unchecked hand-offs')+'</div></div>';
  h+='<div class="card"><h3>What this shows</h3><ul class="find">'+
    '<li><b>Work.</b> '+cnt[5]+' activities may go to Automation and '+cnt[4]+' to Agent-delegation; '+(cnt[2]+cnt[3])+' keep a person doing or approving every instance.</li>'+
    '<li><b>People.</b> '+accTop.map(([n,r])=>n+' ('+r.acc+')').join(', ')+' hold '+pct(accTop.reduce((s,[n,r])=>s+r.acc,0),118)+' of all accountability, and it stays with them as the work moves.</li>'+
    '<li><b>Data.</b> '+nvp+' verification points: places a person checks AI-touched work before acting on it. '+hoActs.length+' activities receive AI-touched work with no person in between and must name a control.</li></ul></div>';
  h+='<div class="card" style="padding:0;overflow-x:auto"><div style="padding:14px 18px 6px"><h3>Latest change to the reference</h3><div class="sub">GR-058, applied in one change-log entry: '+changed.length+' ceilings derived from their element ceilings, and 7.2.1.4&rsquo;s Consequence of Error from Low to Moderate.</div></div><table class="t"><thead><tr><th>Activity</th><th style="text-align:left">Ceiling</th><th class="hide-s" style="text-align:left">Ceiling factors</th></tr></thead><tbody>';
  changed.forEach(a=>{h+='<tr><td><span class="code">'+a.code+'</span> '+esc(a.name)+'</td><td style="text-align:left;white-space:nowrap">'+a.ceiling+' → '+derivedCeil(a)+'</td><td class="hide-s" style="text-align:left">'+a.f.map(x=>FL[x]).join(', ')+'</td></tr>';});
  h+='</tbody></table></div>';
  h+='<div class="outline"><h3>Test the next change</h3><p>The <a href="../work_elements/element_ceilings_sketch.html">element-ceilings stress test</a> sits here, so a proposed change to the reference can be tried across all 118 activities before it is applied.</p></div>';
  return h;
}
function orgFindings(){
  const as=DATA.acts.filter(a=>ABCSTAGE[a.code]);
  const past=as.filter(a=>rank(curOf(a))>rank(derivedCeil(a))), pe=as.filter(a=>pastEls(a).length);
  const refChg=DATA.acts.filter(a=>PILOT.some(p=>a.code.startsWith(p+'.'))&&a.ceiling!==derivedCeil(a));
  const note='<div class="prov">In this sketch, '+esc(ORGNAME())+' shows the three illustrative element assessments (7.2.1.1, 7.2.1.4, 7.4.4); the real build reads its saved assessments and overrides.</div>';
  if(S.fmode==='exc'){
    const rows=[['Element past its own ceiling (new with GR-058)',pe.map(a=>a.code+' '+pastEls(a).join(', '))],['Past the Progression Ceiling, no override',past.map(a=>a.code)],['Reference changed since assessed (GR-058)',refChg.map(a=>a.code)],['Changed the proposal / ceiling overrides','read from its records']];
    return '<div class="card"><h3>Exceptions report</h3><div class="sub">Every place '+esc(ORGNAME())+' departs from the reference, by type. Rolled up from activity to process, process group and category in the real build, and printable for executive review.</div>'+note+'</div>'+
      '<div class="card" style="padding:0;overflow-x:auto"><table class="t"><thead><tr><th>Type of exception</th><th>Count</th><th style="text-align:left">Activities</th></tr></thead><tbody>'+
      rows.map(([k,v])=>'<tr><td>'+k+'</td><td>'+(Array.isArray(v)?(v.length||'<span class="z">0</span>'):'—')+'</td><td style="text-align:left">'+(Array.isArray(v)?(v.join(' · ')||'<span class="z">none</span>'):'<span class="small">'+v+'</span>')+'</td></tr>').join('')+'</tbody></table></div>';
  }
  let h='<div class="card"><h3>'+esc(ORGNAME())+' — executive summary</h3><div class="sub">GR-056. Assessed values against the reference.</div><div class="tiles">'+
    tile(as.length+' of 118','activities assessed')+tile(past.length,'past the Progression Ceiling')+tile(pe.length,'with an element past its own ceiling')+tile(refChg.length,'to reassess: reference changed since assessed')+'</div>'+note+'</div>';
  const f=[];
  f.push(as.map(a=>a.code+' at '+curOf(a)).join(', ')+'.');
  f.push(past.length?past.length+' past the ceiling.':'None is past its Progression Ceiling.');
  if(pe.length) f.push('<b>Needs a decision:</b> '+pe.map(a=>a.code+' '+esc(a.name)+': '+pastEls(a).join(', ')+' is past its element ceiling').join('; ')+'. The activity is within its ceiling, but the element the ceiling factor protects is not.');
  if(refChg.length) f.push('<b>To reassess:</b> GR-058 changed the ceiling of '+refChg.map(a=>a.code).join(', ')+' in the processes ABC assessed in its pressure test, so those assessments show &ldquo;reference changed since assessed&rdquo; until confirmed.');
  h+='<div class="card"><h3>What this shows</h3><ul class="find">'+f.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
  h+='<div class="outline"><h3>Handed to the human-impact side</h3><p>The role hand-off (GR-056) carries, for each role, the work change that lands on it: the People view&rsquo;s load numbers read from this organization&rsquo;s Current State instead of the ceiling.</p></div>';
  return h;
}
function findMain(){return isOrg()?orgFindings():refFindings();}

const ORGS=[['ref','Reference Model'],['abc','ABC Test Org (test data)']];
function pickOrg(v){if(v==='__new__'){alertNew=true;}else{S.org=v;alertNew=false;if(v==='ref'&&S.ws==='assessed')S.ws='all';}render()}
let alertNew=false;
function render(){
  document.getElementById('views').innerHTML=VIEWS.map(v=>'<button class="'+(S.view===v.id?'on':'')+'" onclick="S.view=\''+v.id+'\';render()">'+v.name+'<small>'+v.q+'</small></button>').join('');
  // Same list as today's sandbox selector: the Reference Model, every organization on file, and New organization (Tim, Oct 8: one to many organizations).
  document.getElementById('orgsel').innerHTML=ORGS.map(o=>'<option value="'+o[0]+'"'+(S.org===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'<option value="__new__">New organization\u2026</option>';
  const M={work:[workSide,workMain],people:[peopleSide,peopleMain],data:[dataSide,dataMain],findings:[findSide,findMain]}[S.view];
  document.getElementById('side').innerHTML=M[0]()+(S.org==='abc'&&S.view!=='findings'&&S.view!=='work'?'<p class="small" style="margin-top:12px">ABC Test Org&rsquo;s assessed values are read live in the real build; this sketch shows the reference.</p>':'');
  document.getElementById('main').innerHTML=(alertNew?'<div class="outline"><span class="tagline">Sketch</span><h3>New organization</h3><p>Opens the same New organization form as today&rsquo;s sandbox. Every organization on file appears in this list, so the four views work the same for one organization or many.</p></div>':'')+M[1]();
}
applyRaci();render();
