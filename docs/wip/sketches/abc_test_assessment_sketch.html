<title>Sketch: ABC Test Assessment</title>
<style>
:root{--navy:#1B4F8A;--navy-d:#0D2D4F;--dark:#0D1B2A;--gray:#444;--lgray:#6B7A90;--bg:#F4F6FB;--border:#DDE3EE;--hl:#FFFBEB;--red:#991B1B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--dark);padding-bottom:60px}
.sk{background:#FEF3C7;border-bottom:2px solid #B8873F;color:#7A5A1E;font-size:12.5px;text-align:center;padding:9px 16px}

.pl{font-size:12.5px;line-height:1.7;margin-top:14px}.pl a{color:var(--navy);font-weight:600;text-decoration:none}.pl a:hover{text-decoration:underline}
.top .meta{font-size:12px;color:#9FC2EE;margin:3px 0 10px}

.views{display:flex;gap:2px;flex-wrap:wrap}

.views button small{display:block;font-size:10.5px;font-weight:400;color:#9FC2EE;margin-top:1px}

.org{display:flex;gap:6px;align-items:center;padding-bottom:9px;font-size:11px;color:#9FC2EE;text-transform:uppercase;letter-spacing:.05em}
.org select{font:inherit;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:600;padding:5px 8px;border-radius:6px;border:1px solid #fff;background:#fff;color:var(--navy-d);min-width:200px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.side{flex:0 1 320px;min-width:250px}
.side .q{font-family:Georgia,serif;font-size:16px;color:var(--navy-d);line-height:1.35;margin-bottom:8px}
.side p{font-size:12.5px;color:var(--gray);line-height:1.6;margin-bottom:10px}
.side h5{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--lgray);margin:16px 0 6px}
.stack{display:flex;flex-direction:column;gap:5px}

.replaces{font-size:11.5px;color:var(--lgray);border-top:1px solid var(--border);padding-top:10px;margin-top:16px;line-height:1.5}
.main{flex:1;min-width:300px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px}

.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{flex:1;min-width:140px;border:1px solid #EEF1F6;border-radius:8px;padding:10px 12px}
.tile .n{font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--navy-d)}

.tile .was{font-size:11px;color:var(--lgray)}
.prov{font-size:10.5px;color:var(--lgray);margin-top:8px}
.find{font-size:13px;line-height:1.6}
.find li{margin:0 0 7px 18px}
table.t{width:100%;border-collapse:collapse}
.t th{background:var(--navy-d);color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;text-align:right;padding:8px 8px;vertical-align:bottom;line-height:1.3}
.t th:first-child{text-align:left}
.t td{padding:8px 8px;border-top:1px solid #EEF1F6;font-size:12.5px;text-align:right;vertical-align:top}
.t td:first-child{text-align:left}
.t tr.r{cursor:pointer}
.t tr.r:hover td{background:#F7F9FC}
.t tr.tier td{background:#EEF3FA;font-weight:600;color:var(--navy-d);font-size:11.5px;text-align:left}
.z{color:#B0B8C6}
.chg{background:var(--hl)}
.small{font-size:11px;color:var(--lgray)}
.tg{display:inline-block;width:12px;color:var(--navy);font-weight:700}
.t tr.tier.proc td{font-weight:400;color:var(--dark);font-size:13px;padding-top:9px;padding-bottom:9px}
.prow{display:flex;align-items:flex-start;gap:12px}
.prow .pn{flex:1;min-width:0;line-height:18px;font-weight:400}
.prow .pn .tg,.prow .pn .code{font-weight:400}
.ph{display:flex;align-items:baseline;gap:4px;white-space:nowrap;font-size:9.5px;line-height:14px;align-self:flex-start;letter-spacing:.04em}
.lab{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--lgray)}
.hprov{font-size:12px;letter-spacing:0;color:var(--lgray);min-width:70px}
.hv{display:inline-block;min-width:38px;font-size:11px;letter-spacing:0;text-align:right;color:var(--navy);font-variant-numeric:tabular-nums}
.ph .sep{color:var(--lgray);margin:0 2px}
.pc{flex:0 0 210px;width:210px;display:flex;flex-direction:column;gap:1px;font-size:12px}
.lab2{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--lgray);line-height:14px}
.hfig{cursor:pointer;border-bottom:1px dotted currentColor}.hfig:hover,.hfig.sel{border-bottom-style:solid}
tr.det td{background:#FAFBFD;text-align:left;padding:6px 10px 12px 26px}
.al{border-collapse:collapse;width:100%}
.al td{font-size:12px;padding:3px 6px;border-top:1px solid #EEF1F6;text-align:left}
.al tr:first-child td{border-top:none}
.code{font-family:Consolas,monospace;color:var(--gray);white-space:nowrap}
.hc{color:var(--red)}
.outline{border:1.5px dashed #C6D8EE;border-radius:10px;padding:18px 20px;background:#FAFBFD;margin-bottom:16px}
.outline h3{font-size:14px;color:var(--navy-d);margin-bottom:6px}
.outline p,.outline li{font-size:12.5px;color:var(--gray);line-height:1.6}
.outline ul{margin:4px 0 0 18px}
.outline a{color:var(--navy);font-weight:600}
.tagline{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#7A5A1E;background:#FEF3C7;border:1px solid #F0C67A;border-radius:3px;padding:0 6px;margin-bottom:8px}
.gsel{font:inherit;font-size:12.5px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;width:100%}
.mramp{display:flex;align-items:center;gap:0}
.dot{width:18px;height:18px;border-radius:50%;background:#EDEFF3;box-sizing:border-box;flex:0 0 auto}
.dot.sm{width:11px;height:11px}
.mgap{width:7px}.mlock{width:16px;text-align:center;line-height:0}.mlock svg{width:9px;height:10px}
.ramp{display:flex;align-items:flex-start;flex-wrap:nowrap}
.step{display:flex;flex-direction:column;align-items:center;min-width:92px;cursor:pointer}
.lbl{font-size:12.5px;margin-top:5px;white-space:nowrap}
.step.dim .lbl{color:#A9B2C2}
.step.sel .lbl{text-decoration:underline;text-underline-offset:4px}
.arr{width:34px;text-align:center;color:var(--navy);font-size:18px;cursor:pointer;line-height:18px}
.arr.dim{color:#C4CBD7}.arr.sel{font-weight:700}
.lock{width:34px;text-align:center;cursor:pointer;line-height:18px}
.ix{position:absolute;right:10px;top:6px;border:none;background:none;font-size:17px;color:var(--lgray);cursor:pointer}
.ibox{position:relative;margin:2px 0 4px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:12px 16px 14px;max-width:820px}

.isub{font-size:11.5px;color:var(--lgray);margin-bottom:8px;line-height:1.5}
.isub a{color:var(--navy);font-weight:600}
.it{width:100%;border-collapse:collapse}
.it td{font-size:12.5px;padding:5px 8px;border-top:1px solid #EEF1F6;text-align:left;vertical-align:top}
.it tr:first-child td{border-top:none}
.it td.el{width:130px;white-space:nowrap}.it td.obj{color:var(--gray)}.it td.stt{width:240px}
.it tr.chgrow td{background:var(--hl)}
.ctl{color:var(--navy);font-size:11px;margin-left:3px}
.na{font-size:11.5px;color:var(--lgray);margin-top:8px}
.ev{margin-top:10px;font-size:12.5px;line-height:1.55}
.amber{color:#9A6A00}.red{color:var(--red)}
.wt td{vertical-align:middle}
.ahead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px;font-size:13px}
.acons{font-size:12px;white-space:nowrap;cursor:pointer;border-bottom:1px dotted currentColor}
.acons:hover,.acons.sel{border-bottom-style:solid}
.it td.ck{width:22px;color:var(--navy-d)}
.it tr.off td{color:#9AA3B2}
.wt .ramp{padding-left:4px}
.wt tr.det td{padding:0 12px 12px 12px;background:#fff}
@media(max-width:640px){.it td.obj{display:none}.it td.el,.it td.stt{width:auto;white-space:normal}.step{min-width:78px}.lbl{font-size:11px}}
@media(max-width:640px){.side,.main{flex:1 1 100%;min-width:0}.hide-s{display:none}.t th,.t td{padding:7px 4px}.views button{padding:8px 11px;font-size:12.5px}.views button small{display:none}}

.t td.red{color:var(--red)}
.t tr.tier td{font-weight:400;color:var(--dark);font-size:12.5px}
.tiles.six .tile{min-width:90px}

<script>
// Reference data and element helpers, copied from four_view_sandbox_sketch.html.
const DATA={"acts": [{"code": "7.1.1.1", "name": "Identify strategic HR needs", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Sets the strategic direction the rest of 7.1 executes against — a standing strategic-judgment duty, not a runway gap, holds this at Judgment.", "cn": "Reach is broad (frames strategy for the whole function) but the assessment itself is easily revised — moderate human/ops impact, no legal exposure, high reversibility keep this at Moderate.", "cf": ["human", "ops", "reach"]}, {"code": "7.1.1.2", "name": "Define HR and business function roles and accountability", "A": "CHRO", "ceiling": "Judgment", "cons": "High", "f": ["accountability", "floor"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Already at ceiling — Executive tier. Defining the domain's own accountability structure isn't a decision to hand to an AI proposal.", "cn": "Sets accountability org-wide (high reach) and a bad structural call is disruptive and slow to unwind (low reversibility) — human impact and reach, not a specific legal trigger, drive this to High.", "cf": ["human", "reach", "reversibility"]}, {"code": "7.1.1.3", "name": "Determine HR function roles and structure", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Structures HR's own internal organization — a narrower version of 7.1.1.2's accountability-defining work, so it holds at the same tier.", "cn": "Narrower than 7.1.1.2 — structures HR's own internal organization; moderate reach and reversibility, no legal exposure.", "cf": ["reach", "reversibility"]}, {"code": "7.1.1.4", "name": "Determine HR delivery model", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Chooses the operating model the rest of HR delivery runs inside — a structural design call, not a technical gap.", "cn": "Operational design choice (e.g., centralized vs. shared services); moderate ops/financial exposure if mis-sized, correctable at the next planning cycle.", "cf": ["ops", "reversibility"]}, {"code": "7.1.1.5", "name": "Determine HR costs", "A": "CHRO", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical", "governance"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Close call, flagged honestly: cost models are treated as a draft CHRO edits or a recommendation CHRO approves. No standing duty requires CHRO's personal review — ceiling moves one notch per the Progression Ceiling Rule.", "cn": "Cost modeling feeds budget planning — moderate operational/financial impact if wrong, but a draft CHRO reviews before it's acted on, which caps the exposure.", "cf": ["ops"]}, {"code": "7.1.1.6", "name": "Establish HR measures", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Defines what HR is measured against — the same 'sets what the system runs on' logic as 7.5.1.1/7.7.7.3.", "cn": "Defines what HR is measured against — moderate trust/reputation impact if metrics mislead leadership, but revisable each cycle.", "cf": ["trust"]}, {"code": "7.1.1.7", "name": "Communicate HR strategies", "A": "CHRO", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Message drafting and distribution can plausibly move to agent-delegation once accuracy on tone and compliance language is proven — a technical readiness question.", "cn": "Distribution of already-decided strategy; low legal exposure and high reversibility — a poorly worded message can be corrected.", "cf": ["legal", "reversibility"]}, {"code": "7.1.1.8", "name": "Develop strategy for HR systems/technologies/tools", "A": "CHRO", "ceiling": "Judgment", "cons": "High", "f": ["accountability", "floor"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "A wrong technology bet, including AI adoption itself, is costly and hard to unwind — the same standing strategic-judgment duty as the rest of 7.1.1, not a technical gap.", "cn": "A wrong systems-strategy call has real operational/financial impact (multi-year vendor and integration commitments) and broad reach across every downstream HR process — hard to unwind once contracted.", "cf": ["ops", "reach", "reversibility"]}, {"code": "7.1.1.9", "name": "Manage employer branding", "A": "CHRO", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Brand-voice consistency at agent-delegation scale is a capability still being proven, not a standing duty holding it back.", "cn": "Trust/reputation-facing (external candidate perception) but not legally exposed and easily adjusted.", "cf": ["legal", "trust"]}, {"code": "7.1.1.10", "name": "Design the employee experience", "A": "CHRO", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["HRBP Manager", "Director of HR Ops"], "Aroles": ["CHRO"], "proc": "7.1.1 Develop human resources strategy", "note": "Shapes policy and practice across the whole employee base — a standing design-judgment duty, the same 'sets what the system runs on' logic as 7.1.1.6.", "cn": "Broad reach (affects every employee's day-to-day) but a design choice, not a legal or individual-decision exposure — moderate human impact.", "cf": ["human", "legal", "reach"]}, {"code": "7.1.2.1", "name": "Perform strategic workforce planning", "A": "Director of HR Ops", "ceiling": "Judgment", "cons": "Moderate", "f": ["accountability"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Headcount/skills forecasting sets the budget assumptions HR plans against — a standing planning-authority duty, not a temporary gap.", "cn": "Broad reach (headcount/skills planning) but a forecasting exercise revised each cycle — no legal exposure, moderate ops impact if under- or over-resourced.", "cf": ["ops", "reach"]}, {"code": "7.1.2.2", "name": "Develop total compensation and rewards strategy", "A": "Director of HR Ops", "ceiling": "Judgment", "cons": "High", "f": ["legal"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Pay-equity/compensation-discrimination exposure.", "cn": "Sets the pay structure the whole organization runs on — pay-equity/compensation-discrimination legal exposure plus wide reach keep this High.", "cf": ["legal", "reach"]}, {"code": "7.1.2.3", "name": "Develop succession plan", "A": "Director of HR Ops", "ceiling": "Judgment", "cons": "High", "f": ["floor"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Same continuity/favoritism-exposure logic as 7.3.3.4's succession-plan tag.", "cn": "Getting a critical-role succession call wrong is a real continuity risk, and perceived favoritism in who's chosen carries trust exposure — same logic as 7.3.3.4.", "cf": ["ops", "trust"]}, {"code": "7.1.2.4", "name": "Develop high performers/leadership programs", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Moderate", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Program design for high-potential and leadership tracks can move to agent-delegation once pattern-matching on what actually works is proven.", "cn": "Program design affecting a subset of employees; moderate human/trust impact, no legal exposure, revisable.", "cf": ["human", "trust"]}, {"code": "7.1.2.5", "name": "Develop diversity, equity, and inclusion plan", "A": "Director of HR Ops", "ceiling": "Oversight", "cons": "High", "f": ["legal"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "DEI plan design carries real legal exposure in either direction under the current landscape — the exposure attaches at this tier, so it's the ceiling, not a temporary gap.", "cn": "DEI plan design carries real legal exposure in either direction under the current landscape — legal exposure is the driving factor, and it attaches at design, not just execution.", "cf": ["legal"]}, {"code": "7.1.2.6", "name": "Implement diversity, equity, and inclusion plan", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "High", "f": ["legal", "governance"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Same DEI exposure as 7.1.2.5, at execution — the review checkpoint is the safeguard, not a temporary trust gap.", "cn": "Same legal exposure as 7.1.2.5, now at execution — a review checkpoint is the safeguard against a mishandled rollout.", "cf": ["legal", "reversibility"]}, {"code": "7.1.2.7", "name": "Design talent acquisition program", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Program design here is still building the evidence base for agent-delegation, not held back by a standing duty.", "cn": "Program-design work; low direct legal exposure, broad reach but easily revised before it touches an individual candidate.", "cf": ["human", "legal", "reach"]}, {"code": "7.1.2.8", "name": "Design talent development program", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Same technical-readiness question as 7.1.2.7 — program design for talent development, not yet proven for delegation.", "cn": "Same shape as 7.1.2.7 — design-stage work, no individual decision yet, easily revised.", "cf": ["human", "reversibility"]}, {"code": "7.1.2.9", "name": "Develop other HR programs", "A": "Director of HR Ops", "ceiling": "Agent-delegation", "cons": "Low", "f": ["technical"], "R": ["Compensation & Benefits Manager", "HRBP Manager", "Director of L&D", "HR Generalist"], "Aroles": ["Director of HR Ops"], "proc": "7.1.2 Develop and implement workforce planning, policies, and strategies", "note": "Catch-all program design; low stakes until a specific program is built out and its own evidence base accumulates.", "cn": "Catch    elsOf(a).map(e=>{const v=s.el[e],cap=caps(a)[e][0],past=lr(v[0])>lr(cap);return '<tr><td>'+e+(e===ctlOf(a)?' <span class="ctl">◆</span>':'')+'</td><td'+(past?' class="red"':'')+'>'+v[0]+'</td><td>at most '+cap+'</td><td>'+(v[1]?EVL[v[1]]:'<span class="z">none</span>')+'</td><td class="small hide-s">'+esc(v[2]||'')+'</td></tr>'}).join('')+'</table>'+
   '<div class="small" style="margin-top:6px">Source role '+esc(s.sourceRole)+' &middot; confidence '+s.confidence+' &middot; assessed against the reference '+(s.refVersion==='GR-058'?'after GR-058':'before GR-058 (ceiling '+s.refSnapshot.ceiling+', Consequence of Error '+s.refSnapshot.cons+')')+(ov?' &middot; override to '+ov.level+', approved by '+esc(ov.approverRole):'')+'</div>';}
function download(){
  const body={org:'abc',generator:'docs/wip/sketches/abc_test_assessment.js',profile:SET.profile,seed:SET.seed,assessmentShape:'GR-058 element-level',assessments:SET.assessments,overrides:SET.overrides};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(body,null,1)],{type:'application/json'}));a.download='abc_test_org_'+SET.profile+'_seed'+SET.seed+'.json';document.body.appendChild(a);a.click();a.remove();
}
